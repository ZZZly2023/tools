<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" stroke="#fff" stroke-width="8"/>
  
  <!-- 内部装饰 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- 中心图标 -->
  <g transform="translate(256, 256)">
    <!-- React logo 风格 -->
    <circle cx="0" cy="0" r="40" fill="url(#grad2)" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#fff"/>
    
    <!-- 装饰性元素 -->
    <circle cx="-60" cy="-60" r="8" fill="#fff" opacity="0.6"/>
    <circle cx="60" cy="-60" r="8" fill="#fff" opacity="0.6"/>
    <circle cx="-60" cy="60" r="8" fill="#fff" opacity="0.6"/>
    <circle cx="60" cy="60" r="8" fill="#fff" opacity="0.6"/>
  </g>
  
  <!-- 文字 -->
  <text x="256" y="420" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Vite + React + Electron
  </text>
</svg> 